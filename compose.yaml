version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: securemailscope-backend:latest
    container_name: securemailscope-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./demo_pcaps:/app/demo_pcaps:ro,z
      - ./reports:/app/reports:z
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    networks:
      - securemailscope-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: securemailscope-frontend:latest
    container_name: securemailscope-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - securemailscope-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  securemailscope-net:
    driver: bridge
