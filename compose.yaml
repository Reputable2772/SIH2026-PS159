version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: securemailscope-backend:latest
    container_name: securemailscope-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./demo_pcaps:/app/demo_pcaps:ro
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    networks:
      - securemailscope-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  securemailscope-net:
    driver: bridge
